<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="micGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Microphone Icon -->
  <g transform="translate(20, 20)">
    <!-- Mic Body -->
    <rect x="20" y="10" width="20" height="35" rx="10" fill="url(#micGradient)"/>
    <!-- Mic Stand -->
    <path d="M 30 45 L 30 55 M 20 55 L 40 55" stroke="url(#micGradient)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Sound Waves -->
    <path d="M 5 25 Q 5 15, 10 15" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 0 25 Q 0 10, 8 10" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M 5 25 Q 5 35, 10 35" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 0 25 Q 0 40, 8 40" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
    
    <path d="M 55 25 Q 55 15, 50 15" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 60 25 Q 60 10, 52 10" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M 55 25 Q 55 35, 50 35" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 60 25 Q 60 40, 52 40" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>
  
  <!-- Brand Text -->
  <text x="110" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="700" fill="url(#brandGradient)">SuperSpeech</text>
  
  <!-- Tagline -->
  <text x="112" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#64748b" letter-spacing="1.5">PROFESSIONAL SPEECHES FOR ANY OCCASION</text>
</svg>
